[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portolano"
version = "0.1.0"
description = "Project knowledge your coding agent writes, reads and keeps honest - and that knows when it has gone out of date."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gabriele Brosulo" }]
keywords = ["documentation", "coding-agents", "wiki", "context-rot", "agents-md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/g4b0/portolano"
Documentation = "https://github.com/g4b0/portolano/tree/main/docs"
Issues = "https://github.com/g4b0/portolano/issues"

[project.scripts]
portolano = "portolano.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portolano"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Real errors and import order. No style rules: this is a set of scripts, not a
# codebase to police. Pinned so a ruff release cannot widen it under us.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# `helpers` is tests/helpers.py, ours - without this ruff files it under
# third-party and asks to sort it next to pytest.
known-first-party = ["portolano", "helpers"]
